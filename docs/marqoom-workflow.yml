name: Marqoom data checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit fastapi python-multipart httpx
      - run: python -m unittest discover -s tests -v
      - run: python -m pre_commit run --all-files
